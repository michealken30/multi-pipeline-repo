name: Reusable Python Docker Build & Deploy to AWS Lambda

on:
  workflow_call:
    inputs:
      repo:
        description: "The repository containing the Python app"
        required: true
        type: string
      path:
        description: "Relative path to the Python app inside the repo"
        required: true
        type: string
      image_name:
        description: "Name of the Docker image (ECR repo name)"
        required: true
        type: string
      lambda_function:
        description: "Name of the AWS Lambda function to update"
        required: true
        type: string
      push:
        description: "Whether to push and deploy (true/false)"
        required: true
        default: "false"
        type: string

    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout external repo containing Python app
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          path: app-repo

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin 970547377227.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        working-directory: app-repo/${{ inputs.path }}
        run: |
          echo "FROM python:3.10-slim" > Dockerfile
          echo "WORKDIR /app" >> Dockerfile
          echo "COPY . ." >> Dockerfile
          echo "CMD [\"python\", \"main.py\"]" >> Dockerfile
          docker build -t ${{ inputs.image_name }} .

      - name: Tag and Push Docker image to ECR
        if: ${{ inputs.push == 'true' }}
        run: |
          IMAGE_URI=970547377227.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ inputs.image_name }}:latest
          docker tag ${{ inputs.image_name }} $IMAGE_URI
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Update AWS Lambda function with new image
        if: ${{ inputs.push == 'true' }}
        run: |
          echo "Updating Lambda function with new image..."
          aws lambda update-function-code \
            --function-name ${{ inputs.lambda_function }} \
            --image-uri $IMAGE_URI
